<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurelia Games - Home</title>
    <link rel="stylesheet" href="styleluqid.css"> 
</head> 
<body>
    <div class="container">
        <header class="navbar">
            <div class="nav-left">
                <a href="profile.html" class="icon-btn profile-btn" title="Profil">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </a>
                <button class="icon-btn notify-btn" title="Bildirimler">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32"/></svg>
                </button>
            </div>
            <nav class="nav-links">
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="index2.html" class="nav-link active">Home</a>
                <a href="games.html" class="nav-link">Games</a>
            </nav>
            <div class="nav-right">
                <button class="auth-btn log-in">Log in</button>
                <button class="auth-btn sign-up">Sign up</button>
            </div>
        </header>

        <section class="main-banner">
            <div class="banner-slides">
                <div class="slide slide-1 active">
                    <span class="badge-new">NEW!</span>
                    <h1>AURELIA IN-HOUSE GRAPHICS</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                    <a href="#" class="read-more">READ MORE</a>
                </div>
            </div>
        </section>

        <div class="dashboard-grid">
            
            <button class="daily-tasks-card home-glass-card">
                <h2>Daily Tasks</h2>
                <ul class="task-list">
                    <li>
                        <span class="task-icon">👾</span>
                        <span class="task-text">Play 1 game of Aurelia Chess</span>
                        <span class="task-xp">+250 XP</span>
                    </li>
                </ul>
                <div class="support-btn">Support Us</div>
            </button>

            <div class="explore-section home-glass-card">
                <h2>Explore</h2>
                <div class="explore-buttons">
                    <button class="explore-btn"><span class="btn-text">DAILY MISSIONS</span></button>
                    <button class="explore-btn"><span class="btn-text">MATCHMAKING</span></button>
                </div>
            </div>

            <div class="stats-column">
                <button class="rank-card home-glass-card">
                    <h3>Your Rank</h3>
                    <div class="rank-value">1</div>
                </button>
                <button class="timer-card home-glass-card">
                    <h3>Timer</h3>
                    <div class="timer-value">00:00:00</div>
                </button>
            </div>

            <button class="leaderboard-card home-glass-card">
                <h2>Monthly Board</h2>
                <div class="leaderboard-list">
                    <div class="leaderboard-item">
                        <span class="user-meta">#1 beymisafir</span>
                        <span class="user-xp">14.2k XP 👑</span>
                    </div>
                </div>
            </button>

        </div>
    </div>
</body>
</html>
