<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurelia Games - Profile</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="profile-body">
    <div class="container profile-container">
        <header class="navbar">
            <div class="nav-left">
                <a href="./profile.html" class="icon-btn profile-btn" title="Profil">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </a>
                <button class="icon-btn notify-btn" title="Bildirimler">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                </button>
            </div>
            <nav class="nav-links">
                <a href="./profile.html" class="nav-link active">Profile</a>
                <a href="./index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link">Explore</a>
                <a href="#" class="nav-link">Games</a>
                <a href="./focus.html" class="nav-link">Focus</a>
            </nav>
            <div class="nav-right">
                <button class="auth-btn log-in">Settings</button>
                <button class="auth-btn sign-up">Log out</button>
            </div>
        </header>

        <div class="profile-central-layout">
    
    <div class="profile-sidebar-card">
        <h1 class="profile-username">EmreBronze</h1>
        
        <div class="profile-avatar-container">
            <img src="https://media.discordapp.net/attachments/1480011788232822836/1506053950565253180/kitty_gang.png?ex=6a0cdd8a&is=6a0b8c0a&hm=5a404b189f88b019912059d8e9131bd40d9be347bdceba4f590026c46e4d1fe1&=&format=webp&quality=lossless&width=610&height=688" alt="Avatar" class="profile-avatar-img">
        </div>

        <div class="profile-uid">UID 880253346</div>

        <div class="profile-xp-section">
            <div class="profile-xp-bar-container">
                <div class="profile-xp-progress" style="width: 85%;"></div>
            </div>
            <div class="profile-level-row">
                <span class="profile-lvl">Lvl 22</span>
                <span class="profile-xp-nums">55.4k / 60k</span>
            </div>
        </div>

        <div class="profile-badges-row">
            <span class="p-badge pink-gem">💎</span>
            <span class="p-badge gold-trophy">🏆</span>
            <span class="p-badge energy-bolt">⚡</span>
        </div>
    </div>

    <div class="profile-bottom-actions">
        <button class="action-tab-btn"><span class="tab-icon"></span> 14 Fallowing</button>
        <button class="action-tab-btn"><span class="tab-icon"></span> 102 Fallowers</button>
        <button class="action-tab-btn"><span class="tab-icon">⭐</span> Achievements</button>
        <button class="action-tab-btn"><span class="tab-icon">📊</span> Statistics</button>
        <button class="action-tab-btn"><span class="tab-icon">🎒</span> Collection</button>
        <button class="action-tab-btn"><span class="tab-icon">💬</span> Comments</button>
    </div>

</div>
        
    <script src="./index.js"></script>
</body>
</html>
