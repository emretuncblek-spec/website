<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurelia Games - Profile</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="profile-body">
    <div class="container profile-container">

        <!-- ===================== NAVBAR ===================== -->
        <header class="navbar">
            <div class="nav-left">
                <a href="./profile.html" class="icon-btn profile-btn" title="Profil">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </a>
                <button class="icon-btn notify-btn" title="Bildirimler">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                    </svg>
                </button>
            </div>

            <nav class="nav-links">
                <a href="./profile.html" class="nav-link active">Profile</a>
                <a href="./index2.html" class="nav-link">Home</a>
                <a href="./games.html"  class="nav-link">Games</a>
            </nav>

            <div class="nav-right">
                <button class="auth-btn log-in">Settings</button>
                <button class="auth-btn sign-up">Log out</button>
            </div>
        </header>

        <!-- ===================== ORTA İÇERİK ===================== -->
        <div class="profile-central-layout">

            <!-- ── PROFİL KARTI ── -->
            <div class="profile-sidebar-card">

                <!-- Kullanıcı Adı -->
                <h1 class="profile-username">EmreBronze</h1>

                <!-- Yuvarlak Avatar -->
                <div class="profile-avatar-container">
                    <!--
                        Avatar resmini buraya ekle.
                        Örnek: kendi Imgur linkini yaz.
                        Şu an örnek bir kedi resmi kullanılıyor.
                    -->
                    <img
                        class="profile-avatar-img"
                        src="https://i.imgur.com/wvB5mGE.jpeg"
                        alt="EmreBronze avatar"
                    />
                </div>
 
                <!-- UID -->
                <p class="profile-uid">UID 880253346</p>

                <!-- XP Bar -->
                <div class="profile-xp-section">
                    <div class="profile-xp-bar-container">
                        <!--
                            width değerini XP yüzdesine göre ayarla.
                            55.4k / 60k = ~92%
                        -->
                        <div class="profile-xp-progress" style="width: 92%;"></div>
                    </div>
                    <div class="profile-level-row">
                        <span>Lvl 22</span>
                        <span>55.4k / 60k</span>
                    </div>
                </div>

                <!-- Rozetler -->
                <div class="profile-badges-row">
                    <span class="p-badge" title="Elmas Rozet">💎</span>
                    <span class="p-badge" title="Kupa Rozet">🏆</span>
                    <span class="p-badge" title="Yıldırım Rozet">⚡</span>
                </div>

            </div>
            <!-- ── /PROFİL KARTI ── -->

            <!-- ── ALT BUTON GRUBU ── -->
            <div class="profile-bottom-actions">
                <button class="action-tab-btn">
                    <span>14 Following</span>
                </button>
                <button class="action-tab-btn">
                    <span>102 Followers</span>
                </button>
                <button class="action-tab-btn">
                    <span class="tab-icon">⭐</span>
                    <span>Achievements</span>
                </button>
                <button class="action-tab-btn">
                    <span class="tab-icon">📊</span>
                    <span>Statistics</span>
                </button>
                <button class="action-tab-btn">
                    <span class="tab-icon">🎒</span>
                    <span>Collection</span>
                </button>
                <button class="action-tab-btn">
                    <span class="tab-icon">💬</span>
                    <span>Comments</span>
                </button>
            </div>
            <!-- ── /ALT BUTON GRUBU ── -->

        </div>
        <!-- ===================== /ORTA İÇERİK ===================== -->

    </div>

    <script src="./index.js"></script>
</body>
</html>
